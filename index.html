<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Antwortscanner – ArUco mit OpenCV.js</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #video, #canvas {
      width: 640px;
      height: 480px;
      background: #000;
      display: block;
      margin-bottom: 10px;
    }
    #output {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>

  <!-- OpenCV.js mit ArUco -->
  <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
</head>

<body>
  <h1>Antwortscanner – ArUco mit OpenCV.js</h1>

  <video id="video" autoplay></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="output">Noch kein Marker erkannt…</div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const output = document.getElementById("output");

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { video.srcObject = stream; video.play(); });

    function onOpenCvReady() {
      const dictionary = new cv.aruco.getPredefinedDictionary(cv.aruco.DICT_4X4_50);
      const detector = new cv.aruco.ArucoDetector(dictionary);

      function detect() {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const src = cv.imread(canvas);

        const markerCorners = new cv.MatVector();
        const markerIds = new cv.Mat();

        detector.detectMarkers(src, markerCorners, markerIds);

        if (!markerIds.empty()) {
          const id = markerIds.data32S[0];
          output.innerText = "Marker erkannt: " + id;

          cv.aruco.drawDetectedMarkers(src, markerCorners, markerIds);
        } else {
          output.innerText = "Kein Marker erkannt…";
        }

        cv.imshow(canvas, src);

        src.delete();
        markerCorners.delete();
        markerIds.delete();

        requestAnimationFrame(detect);
      }

      detect();
    }

    if (cv.getBuildInformation) onOpenCvReady();
    else cv['onRuntimeInitialized'] = onOpenCvReady;
  </script>
</body>
</html>
