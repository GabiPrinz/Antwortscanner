<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Antwortscanner – ArUco Debug</title>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
  body { font-family: sans-serif; padding: 20px; }
  video { width: 400px; border: 2px solid black; }
  #output { margin-top: 20px; font-size: 20px; }
  #chart { margin-top: 30px; }
</style>
</head>
<body>

<h1>Antwortscanner – ArUco Debug</h1>
<p>Zeigt erkannte Marker mit grünen Rahmen und IDs direkt im Videobild.</p>

<video id="video" autoplay></video>
<canvas id="canvas" width="640" height="480"></canvas>

<div id="output">Letzte Erkennung: –</div>

<script>
  // Kamera starten
  const video = document.getElementById("video");
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => video.srcObject = stream);

  function onOpenCvReady() {
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const output = document.getElementById("output");

    const dict = cv.aruco.getPredefinedDictionary(cv.aruco.DICT_4X4_50);
    const parameters = new cv.aruco.DetectorParameters();

    function scan() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        let src = cv.imread(canvas);
        let corners = new cv.MatVector();
        let ids = new cv.Mat();

        cv.aruco.detectMarkers(src, dict, corners, ids, parameters);

        // Debug: Marker sichtbar machen
        cv.aruco.drawDetectedMarkers(src, corners, ids);

        // Debug: Bild anzeigen
        cv.imshow(canvas, src);

        if (!ids.empty()) {
          let detected = [];

          for (let i = 0; i < ids.rows; i++) {
            let id = ids.intAt(i, 0);
            detected.push(id);
          }

          output.innerText = "Letzte Erkennung: " + detected.join(", ");
        }

        src.delete();
        corners.delete();
        ids.delete();
      }

      requestAnimationFrame(scan);
    }

    scan();
  }

  setTimeout(onOpenCvReady, 500);
</script>

</body>
</html>
