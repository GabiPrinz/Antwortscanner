<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Antwortscanner – ArUco Debug</title>

  <!-- OpenCV laden -->
  <script src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #video {
      width: 640px;
      height: 480px;
      background: #000;
      display: block;
      margin-bottom: 10px;
    }
    #canvas {
      width: 640px;
      height: 480px;
      border: 1px solid #ccc;
      background: #eee;
      display: block;
      margin-bottom: 10px;
    }
    #output {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Antwortscanner – ArUco Debug</h1>

  <!-- Kamera -->
  <video id="video" autoplay></video>

  <!-- Canvas für OpenCV -->
  <canvas id="canvas" width="640" height="480"></canvas>

  <!-- Ausgabe -->
  <div id="output">Noch kein Marker erkannt…</div>

  <script>
    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");
    let ctx = canvas.getContext("2d");
    let output = document.getElementById("output");

    // Kamera starten
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    }).then(stream => {
      video.srcObject = stream;
      video.play();
    });

    // Wird automatisch aufgerufen, wenn OpenCV fertig geladen ist
    function onOpenCvReady() {
      console.log("OpenCV geladen.");
      startDetection();
    }

    function startDetection() {
      const dictionary = new cv.aruco.Dictionary(cv.aruco.DICT_4X4_50);
      const parameters = new cv.aruco.DetectorParameters();
      const detector = new cv.aruco.ArucoDetector(dictionary, parameters);

      function detect() {
        // Videobild ins Canvas kopieren
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Canvas in OpenCV-Matrix umwandeln
        let src = cv.imread(canvas);

        let corners = new cv.MatVector();
        let ids = new cv.Mat();

        detector.detectMarkers(src, corners, ids);

        if (!ids.empty()) {
          output.innerText = "Marker erkannt: " + ids.data32S[0];
          cv.aruco.drawDetectedMarkers(src, corners, ids);
        } else {
          output.innerText = "Kein Marker erkannt…";
        }

        cv.imshow(canvas, src);

        src.delete();
        corners.delete();
        ids.delete();

        requestAnimationFrame(detect);
      }

      detect();
    }
  </script>

</body>
</html>
