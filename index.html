<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Antwortscanner – ArUco (ohne OpenCV)</title>

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #video, #canvas {
      width: 640px;
      height: 480px;
      background: #000;
      display: block;
      margin-bottom: 10px;
    }
    #output {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>

  <!-- ArUco JS (reines JavaScript, kein OpenCV nötig) -->
  <script src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco/build/aruco.js"></script>
</head>

<body>
  <h1>Antwortscanner – ArUco (ohne OpenCV)</h1>

  <video id="video" autoplay></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="output">Noch kein Marker erkannt…</div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const output = document.getElementById("output");

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { video.srcObject = stream; video.play(); });

    const detector = new AR.Detector();

    function detect() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      const markers = detector.detect(imageData);

      if (markers.length > 0) {
        const id = markers[0].id;
        output.innerText = "Marker erkannt: " + id;

        markers.forEach(marker => {
          ctx.beginPath();
          ctx.strokeStyle = "red";
          ctx.lineWidth = 3;

          marker.corners.forEach((corner, i) => {
            const next = marker.corners[(i + 1) % 4];
            ctx.moveTo(corner.x, corner.y);
            ctx.lineTo(next.x, next.y);
          });

          ctx.stroke();
        });

      } else {
        output.innerText = "Kein Marker erkannt…";
      }

      requestAnimationFrame(detect);
    }

    detect();
  </script>
</body>
</html>
